<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1D4E89">
  <title>AccessEd</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="AccessEd">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script>try{var m=localStorage.getItem("theme");if(m==="dark"||m==="light")document.documentElement.setAttribute("data-theme",m);}catch(e){}</script>
  <script>
    // Chrome can fire "beforeinstallprompt" before the app script has loaded. Catch it here so it is never missed.
    window.__installEvent = null;
    window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__installEvent = e; window.dispatchEvent(new Event('install-ready')); });
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="shell">
    <div id="banner" class="banner" role="status"></div>
    <main id="app"></main>
    <nav id="tabbar" class="tabbar" hidden aria-label="Main"></nav>
  </div>
  <script src="vendor/jszip.min.js"></script>
  <script src="vendor/sha256.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
