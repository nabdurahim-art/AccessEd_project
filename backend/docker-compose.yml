# Starts the API and the database with one command:  docker compose up --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: accessed
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the .env file}
      POSTGRES_DB: accessed
    volumes:
      - db_data:/var/lib/postgresql/data
      # Files in this folder run once, the first time the database is created:
      # first the tables, then the starting data.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/2_seed.sql
    ports:
      # Only this computer can reach the database, never the internet.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accessed -d accessed"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    environment:
      # "db" is the name of the service above, not localhost.
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: accessed
      DB_NAME: accessed
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the .env file (32+ characters)}
      # Leave empty when the web app and the API share one address (Nginx).
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      PACKS_DIR: /app/storage/packs
      PORT: 5000
    volumes:
      - pack_files:/app/storage
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Learners reach the API through Nginx. This port is for this computer only.
      - "127.0.0.1:5000:5000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5000/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  db_data:
  pack_files:
